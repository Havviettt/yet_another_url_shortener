services:
  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    user: developer
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DB_CONNECTION: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
      CPM_SOURCE_CACHE: /workspace/.cache/cpm
      HOME: /home/developer
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined

  app:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_CONNECTION: postgresql://url_shortener:url_shortener@postgres:5432/url_shortener
      USERVER_ENABLE_STACK_USAGE_MONITOR: "0"
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: ["production"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  grafana:
    profiles: ["production"]
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url_shortener
    ports:
      - "15432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_shortener -d url_shortener"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres18_data:
  grafana_data:
